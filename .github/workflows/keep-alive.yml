name: Keep Supabase Project Alive

# O plano free do Supabase pausa o projeto depois de dias sem uso do BANCO.
# Segunda, quarta e sexta ao meio-dia (UTC): o maior intervalo fica em 3 dias,
# com folga para uma execucao falhar.
#
# Duas coisas que ja morderam este arquivo, para nao morderem de novo:
#
#   1. Chamar a raiz `/rest/v1/` NAO serve. Ela devolve so a descricao da API e
#      nao consulta o Postgres — mantinha o projeto acordado no papel. Por isso
#      aqui e um RPC: `comanda_publica` faz um SELECT de verdade em `clientes`,
#      ja existe, ja e executavel por anon, e com um token inexistente devolve
#      `null` sem tocar em nada. Zero superficie nova, uma requisicao so.
#
#   2. A chave vem do segredo SUPABASE_ANON_KEY do repositorio, que NAO
#      acompanha o `.env.local`. Quando o banco mudou para o Brasil a chave
#      trocou, o segredo ficou para tras e as execucoes viraram HTTP 401.
#      Ao rotacionar a chave: gh secret set SUPABASE_ANON_KEY --repo <org>/<repo>

on:
  schedule:
    - cron: '0 12 * * 1,3,5'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta o banco de producao
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          corpo=$(mktemp)
          status=$(curl -sS -o "$corpo" -w '%{http_code}' \
            -X POST "https://zmxytngunmyuscmncdmx.supabase.co/rest/v1/rpc/comanda_publica" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"p_token":"00000000-0000-0000-0000-000000000000"}')

          echo "HTTP $status — resposta: $(cat "$corpo")"

          # 200 com `null` e a resposta certa para um token que nao existe.
          # Reprovar aqui e o unico aviso que existe antes de o projeto ser
          # pausado, e a linha acima ja imprimiu o motivo: 401 e chave velha no
          # segredo, 404 e funcao ou URL errada. (Falha de rede nem chega aqui:
          # o GitHub roda este passo com `bash -e` e o curl ja explica no log.)
          [ "$status" = "200" ]
